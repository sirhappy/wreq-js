[package]
name = "wreq-js"
version = "3.2.0"
edition = "2024"
license = "MIT"
authors = ["Oleksandr Herasymov", "will-work-for-meal"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# HTTP client with browser impersonation
wreq = { version = "0.16.1", default-features = false, features = ["cookies", "gzip", "brotli", "deflate", "zstd", "charset", "system-proxy", "socks", "ws", "stream", "webpki-roots", "tokio-rt"] }
wreq-util = { version = "0.2.0", features = ["emulation-serde", "tokio-rt", "emulation-compression", "emulation-chromium-pki"] }
webpki-root-certs = "1.0.11"

# WebSocket support
futures-util = "0.3.34"

# Byte buffers for streaming bodies
bytes = "1.12.1"

# Cookie construction for Session.setCookies (must track wreq's cookie dependency)
cookie = "0.18.2"

# Neon for Node.js bindings
neon = { version = "1.1.2", default-features = false, features = ["napi-6"] }

# Concurrent maps
dashmap = "6.2.1"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Error handling
anyhow = "1.0.104"

# Async runtime
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-util = "0.7.20"

# Global state management
moka = { version = "0.12.16", features = ["sync"] }
uuid = { version = "1.29.0", features = ["v4"] }

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wreq-util = { version = "0.2.0", features = ["emulation-serde", "tokio-rt", "emulation-compression", "emulation-chromium-pki"] }

[dev-dependencies]
btls = "0.5.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# podfarm: Chrome 156's ClientHello (server_padding 0x12e0, Trust Anchor IDs, ML-DSA), from the
# forks' `podfarm` branches; wreq and btls at the revisions wreq-util's own main pins.
[patch.crates-io]
wreq = { git = "https://github.com/sirhappy/wreq", rev = "f715083dace0b42267176c03d8e174b9b4cdede2" }
wreq-util = { git = "https://github.com/sirhappy/wreq-util", rev = "a2fedda381320902633c2386ca981977a71e148a" }
btls = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
